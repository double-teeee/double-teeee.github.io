name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out website
        uses: actions/checkout@v4
      - name: Restore initial website upload
        if: hashFiles('portfolio-upload-*.zip') != ''
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          for archive in sorted(Path('.').glob('portfolio-upload-*.zip')):
              with ZipFile(archive) as bundle:
                  bundle.extractall('.')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist tests README.md .gitignore
          git rm portfolio-upload-*.zip
          git commit -m "Save portfolio source and optimized assets"
          git push origin HEAD:main
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
