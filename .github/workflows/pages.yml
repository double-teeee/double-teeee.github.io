name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out website
        uses: actions/checkout@v4
      - name: Restore initial website upload
        if: hashFiles('.portfolio-upload/**') != ''
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          import tempfile
          from pathlib import Path
          from zipfile import ZipFile
          parts = sorted(Path('.portfolio-upload').glob('batch-*/part-*.b64'))
          assert len(parts) == 127, 'Incomplete portfolio upload'
          checksum = hashlib.sha256()
          with tempfile.TemporaryFile() as archive:
              for part in parts:
                  data = base64.b64decode(part.read_text(), validate=True)
                  checksum.update(data)
                  archive.write(data)
              assert checksum.hexdigest() == '842049f8d3ce4d3c06787f0cb56612d48427e808a0f485c7a9914017b59f8fc6', 'Portfolio checksum mismatch'
              archive.seek(0)
              with ZipFile(archive) as bundle:
                  bundle.extractall('.')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist tests README.md .gitignore
          git rm -r .portfolio-upload
          git commit -m "Save portfolio source and optimized assets"
          git push origin HEAD:main
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
